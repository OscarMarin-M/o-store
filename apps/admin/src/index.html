<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Admin de O-stores</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Aplica el tema guardado antes de pintar, para no ver un parpadeo.
      try {
        if (localStorage.getItem('os-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {}
    </script>
  </head>
  <body>
    <os-root></os-root>
  </body>
</html>
